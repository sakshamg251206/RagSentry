[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ragsentry"
version = "2.0.0"
description = "Multi-agent security auditor for Retrieval-Augmented Generation (RAG) pipelines."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Saksham Garg" }]
keywords = ["llm", "rag", "security", "red-teaming", "prompt-injection", "multi-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Agents & orchestration
  "crewai[litellm]>=1.15,<2",
  "langgraph>=1.2,<2",
  # Target RAG assistant
  "langchain-groq>=1.1,<2",
  "faiss-cpu>=1.9,<2",
  "fastembed>=0.8,<1",
  "numpy>=1.26",
  # API
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  # Dashboard
  "streamlit>=1.50,<2",
  "httpx>=0.27,<1",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/sakshamg251206/RagSentry"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["ragsentry"]
# Thin adapters around external services and the Streamlit script, exercised manually.
omit = ["src/ragsentry/ui/app.py", "src/ragsentry/target/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "C4", "PT", "RET"]
ignore = [
  "S101",   # assert is fine for invariants and tests
  "RUF001", # emoji and typographic characters in UI copy are intentional
  "E501",   # line length is enforced by the formatter; long prose strings are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
mypy_path = "src"
packages = ["ragsentry"]
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
